services:
  api-course-system:
    build:
      context: .
      target: development
    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - .:/usr/src/app
    depends_on:
      - postgres-course-system

  postgres-course-system:
    image: postgres:18-alpine
    container_name: postgres-course-system
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
