version: '3.8'

services:
  api:
    build:
      context: .
      target: production
    image: api-course-system:latest
    container_name: api-course-system-prod
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      postgres-prod:
        condition: service_healthy
    restart: always

  postgres-prod:
    image: postgres:15-alpine
    container_name: postgres-course-system-prod
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d course_system']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata-prod:
